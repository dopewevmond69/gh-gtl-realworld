version: 2
updates:
  # @rezliant RZ-6D5EA3AF · 2026-09-24 — Defers updates until packages have community vetting window
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

# @rezliant-change-log:start
